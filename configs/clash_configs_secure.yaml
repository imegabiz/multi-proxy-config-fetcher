  "rule-providers": {
    "geosite-malware": {
      "type": "http",
      "format": "text",
      "behavior": "domain",
      "path": "./ruleset/geosite-malware.txt",
      "interval": 86400,
      "url": "https://raw.githubusercontent.com/Chocolate4U/Iran-clash-rules/release/malware.txt"
    },
    "geosite-phishing": {
      "type": "http",
      "format": "text",
      "behavior": "domain",
      "path": "./ruleset/geosite-phishing.txt",
      "interval": 86400,
      "url": "https://raw.githubusercontent.com/Chocolate4U/Iran-clash-rules/release/phishing.txt"
    },
    "geosite-cryptominers": {
      "type": "http",
      "format": "text",
      "behavior": "domain",
      "path": "./ruleset/geosite-cryptominers.txt",
      "interval": 86400,
      "url": "https://raw.githubusercontent.com/Chocolate4U/Iran-clash-rules/release/cryptominers.txt"
    },
    "geosite-ads": {
      "type": "http",
      "format": "text",
      "behavior": "domain",
      "path": "./ruleset/geosite-ads.txt",
      "interval": 86400,
      "url": "https://raw.githubusercontent.com/Chocolate4U/Iran-clash-rules/release/category-ads-all.txt"
    },
    "geosite-ir": {
      "type": "http",
      "format": "text",
      "behavior": "domain",
      "path": "./ruleset/geosite-ir.txt",
      "interval": 86400,
      "url": "https://raw.githubusercontent.com/Chocolate4U/Iran-clash-rules/release/ir.txt"
    },
    "geoip-ir": {
      "type": "http",
      "format": "text",
      "behavior": "ipcidr",
      "path": "./ruleset/geoip-ir.txt",
      "interval": 86400,
      "url": "https://raw.githubusercontent.com/Chocolate4U/Iran-clash-rules/release/ircidr.txt"
    }
  },
  "rules": [
    "GEOIP,lan,DIRECT,no-resolve",
    "NETWORK,udp,REJECT",
    "RULE-SET,geosite-malware,REJECT",
    "RULE-SET,geosite-phishing,REJECT",
    "RULE-SET,geosite-cryptominers,REJECT",
    "RULE-SET,geosite-ads,REJECT",
    "RULE-SET,geosite-ir,DIRECT",
    "RULE-SET,geoip-ir,DIRECT",
    "MATCH,✅ Anonymous Multi"
  ],
  "ntp": {
    "enable": true,
    "server": "time.cloudflare.com",
    "port": 123,
    "interval": 30
  }
}